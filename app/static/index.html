<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>Taskboard</title>
  <style>
:root {
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #172033;
  background: #f8fafc;
  --muted: #778197;
  --line: #e8ebf1;
  --accent: #5058d8;
}
* { box-sizing: border-box; }
body { min-width: 320px; min-height: 100vh; margin: 0; background: #f8fafc; }
button, input { font: inherit; }
button { cursor: pointer; }
.app-shell { display: grid; min-height: 100vh; grid-template-columns: 238px minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; display: flex; height: 100vh; flex-direction: column; padding: 22px 14px 14px; border-right: 1px solid #e9edf3; background: #fff; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px; color: inherit; text-decoration: none; }
.brand-mark { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 9px; background: var(--accent); color: white; }
.brand-mark svg { width: 19px; }
.brand-name { font-size: 15px; font-weight: 750; letter-spacing: -.035em; }
.nav-label { margin: 30px 10px 8px; color: #98a0af; font-size: 10px; font-weight: 750; letter-spacing: .12em; }
.nav-filters { display: grid; gap: 3px; }
.nav-filter { display: flex; height: 37px; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: #667187; font-size: 12px; text-align: left; }
.nav-filter:hover { background: #f5f6fa; color: #29344a; }
.nav-filter[aria-pressed="true"] { background: #f0f1ff; color: #454dc6; font-weight: 650; }
.nav-icon { display: inline-grid; width: 18px; place-items: center; color: #8791a4; font-size: 15px; }
.nav-filter[aria-pressed="true"] .nav-icon { color: var(--accent); }
.filter-count { margin-left: auto; color: #929bad; font-size: 11px; font-variant-numeric: tabular-nums; }
.nav-filter[aria-pressed="true"] .filter-count { color: #555dc5; }
.sidebar-bottom { display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 14px 9px 5px; border-top: 1px solid #eff1f5; color: #8791a4; font-size: 11px; }
.connection-dot, .status-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #46a977; }
.main-area { min-width: 0; }
.topbar { display: flex; height: 57px; align-items: center; justify-content: space-between; padding: 0 34px; border-bottom: 1px solid #e9edf3; background: #fff; }
.breadcrumbs { display: flex; align-items: center; gap: 10px; color: #8a94a7; font-size: 11px; }
.breadcrumbs strong { color: #475269; font-weight: 650; }
.crumb-divider { color: #c1c7d2; }
.api-status { display: inline-flex; align-items: center; gap: 7px; color: #667187; font-size: 11px; }
.api-status.error .status-dot { background: #d96363; }
.content { width: min(100%, 1000px); margin: 0 auto; padding: 46px 48px 80px; }
.page-heading { margin-bottom: 25px; }
.today-label { margin: 0 0 9px; color: #8a94a7; font-size: 11px; font-weight: 650; }
h1 { margin: 0; color: #172033; font-size: 27px; font-weight: 720; letter-spacing: -.045em; }
.page-description { margin: 7px 0 0; color: #818b9e; font-size: 12px; }
.primary { display: inline-flex; min-height: 37px; align-items: center; justify-content: center; gap: 6px; padding: 0 13px; border: 1px solid var(--accent); border-radius: 7px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 650; transition: background .14s, border-color .14s; }
.primary:hover { border-color: #3f48c0; background: #3f48c0; }
.primary:disabled { cursor: wait; opacity: .65; }
.progress-card { margin-bottom: 18px; padding: 15px 17px 14px; border: 1px solid #e8ebf1; border-radius: 9px; background: #fff; }
.progress-heading, .progress-bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.progress-title { color: #475269; font-size: 11px; font-weight: 650; }
.progress-count { color: #606b80; font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
.progress-bottom { margin-top: 8px; }
.progress-caption { color: #929bad; font-size: 10px; }
.progress-track { overflow: hidden; width: min(240px, 45%); height: 5px; border-radius: 99px; background: #eef0f5; }
.progress-track span { display: block; width: 0; height: 100%; border-radius: inherit; background: #5d69d9; transition: width .3s ease; }
.add-form { display: flex; min-height: 46px; align-items: center; gap: 10px; margin-bottom: 34px; padding: 5px 6px 5px 13px; border: 1px solid #e3e7ee; border-radius: 8px; background: #fff; transition: border-color .15s, box-shadow .15s; }
.add-form:focus-within { border-color: #aeb4ed; box-shadow: 0 0 0 3px #5058d812; }
.add-icon { color: #7a84d5; font-size: 18px; line-height: 1; }
.add-form input { min-width: 0; flex: 1; border: 0; outline: 0; color: #263149; background: transparent; font-size: 12px; }
.add-form input::placeholder { color: #a0a8b7; }
.form-hint { color: #a0a8b7; font-size: 10px; }
.add-form .primary { min-height: 32px; }
.task-section { border: 1px solid #e8ebf1; border-radius: 9px; background: #fff; }
.list-toolbar { display: flex; min-height: 67px; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 17px; border-bottom: 1px solid #edf0f4; }
h2 { margin: 0; color: #263149; font-size: 13px; font-weight: 680; }
#task-summary { margin: 4px 0 0; color: #929bad; font-size: 10px; }
.search-wrap { display: flex; width: min(220px, 44%); height: 32px; align-items: center; gap: 7px; padding: 0 8px; border: 1px solid #e9ecf1; border-radius: 6px; color: #929bad; }
.search-wrap:focus-within { border-color: #aeb4ed; }
.search-wrap > span { font-size: 18px; line-height: 1; }
.search-wrap input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: #263149; font-size: 10px; }
.search-wrap input::placeholder { color: #a0a8b7; }
.search-wrap kbd { padding: 1px 4px; border: 1px solid #e9ecf1; border-radius: 3px; color: #a0a8b7; font: inherit; font-size: 9px; }
.task-list { margin: 0; padding: 0 17px; list-style: none; }
.task-row { display: flex; min-height: 54px; align-items: center; gap: 11px; padding: 8px 5px; border-bottom: 1px solid #f0f2f6; animation: row-in .16s ease both; }
.task-row:last-child { border-bottom: 0; }
@keyframes row-in { from { opacity: .5; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
.check-wrap { position: relative; display: grid; width: 19px; height: 19px; flex: 0 0 19px; place-items: center; }
.check-wrap input { position: absolute; width: 19px; height: 19px; margin: 0; opacity: 0; cursor: pointer; }
.checkmark { display: grid; width: 18px; height: 18px; place-items: center; border: 1px solid #cbd1dc; border-radius: 5px; color: transparent; }
.check-wrap input:focus-visible + .checkmark { outline: 3px solid #5058d82b; outline-offset: 2px; }
.check-wrap input:checked + .checkmark { border-color: #4ca97c; background: #4ca97c; color: #fff; }
.checkmark svg { width: 12px; }
.task-text { min-width: 0; flex: 1; overflow-wrap: anywhere; color: #38445b; font-size: 12px; line-height: 1.5; }
.task-row.done .task-text { color: #9ba4b3; text-decoration: line-through; }
.task-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.task-row:hover .task-actions, .task-row:focus-within .task-actions { opacity: 1; }
.icon-button { display: grid; width: 29px; height: 29px; place-items: center; border: 0; border-radius: 5px; background: transparent; color: #8791a4; }
.icon-button:hover { background: #f3f4fa; color: #4d57cc; }
.icon-button.delete:hover { background: #fff1f1; color: #ca5656; }
.icon-button svg { width: 15px; height: 15px; }
.edit-form { display: flex; min-width: 0; flex: 1; gap: 6px; }
.edit-input { min-width: 0; flex: 1; height: 32px; padding: 0 8px; border: 1px solid #cdd2e8; border-radius: 5px; outline: 0; font-size: 12px; }
.edit-input:focus { border-color: #8e96df; box-shadow: 0 0 0 2px #5058d812; }
.save-edit, .cancel-edit { padding: 0 9px; border: 1px solid #e4e7ef; border-radius: 5px; background: #fff; color: #5058c4; font-size: 10px; font-weight: 650; }
.save-edit { border-color: var(--accent); background: var(--accent); color: white; }
.empty-state { display: flex; min-height: 155px; align-items: center; justify-content: center; gap: 13px; padding: 25px; color: #7d879a; }
.empty-icon { display: grid; width: 35px; height: 35px; flex: 0 0 35px; place-items: center; border-radius: 8px; background: #f4f5f8; color: #818ba0; }
.empty-icon svg { width: 18px; }
.empty-state strong { display: block; color: #4a566d; font-size: 11px; font-weight: 650; }
.empty-state span { display: block; margin-top: 4px; color: #8d97a9; font-size: 10px; }
.toast { position: fixed; right: 22px; bottom: 20px; display: flex; align-items: center; gap: 18px; max-width: min(390px, calc(100vw - 32px)); padding: 11px 13px; border: 1px solid #343e53; border-radius: 7px; background: #202a3d; color: #fff; box-shadow: 0 8px 24px #17203325; font-size: 11px; opacity: 0; pointer-events: none; transform: translateY(6px); transition: .16s; }
.toast.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.toast button { border: 0; background: transparent; color: #c6c9ff; font-size: 11px; font-weight: 700; }
@media (max-width: 760px) {
  .app-shell { display: block; }
  .sidebar { position: static; width: 100%; height: auto; padding: 13px 16px 10px; border-right: 0; border-bottom: 1px solid #e9edf3; }
  .brand { padding: 0 2px; }
  .nav-label, .sidebar-bottom { display: none; }
  .nav-filters { display: flex; gap: 5px; margin-top: 13px; overflow-x: auto; }
  .nav-filter { flex: 0 0 auto; height: 33px; gap: 6px; padding: 0 9px; }
  .nav-icon { display: none; }
  .filter-count { margin-left: 2px; }
  .topbar { height: 46px; padding: 0 18px; }
  .content { padding: 30px 18px 55px; }
}
@media (max-width: 480px) {
  h1 { font-size: 23px; }
  .form-hint { display: none; }
  .list-toolbar { align-items: flex-start; flex-direction: column; }
  .search-wrap { width: 100%; }
  .task-list { padding: 0 10px; }
  .task-actions { opacity: 1; }
  .progress-track { width: 38%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Task navigation">
      <a class="brand" href="/" aria-label="Taskboard home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.2 4.2L19.5 6.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">Taskboard</span>
      </a>
      <p class="nav-label">TASKS</p>
      <nav class="nav-filters" aria-label="Task filters">
        <button class="filter nav-filter" type="button" data-filter="all" aria-pressed="true"><span class="nav-icon">☷</span><span>All tasks</span><span class="filter-count" id="count-all">0</span></button>
        <button class="filter nav-filter" type="button" data-filter="active" aria-pressed="false"><span class="nav-icon">○</span><span>To do</span><span class="filter-count" id="count-active">0</span></button>
        <button class="filter nav-filter" type="button" data-filter="done" aria-pressed="false"><span class="nav-icon">✓</span><span>Completed</span><span class="filter-count" id="count-done">0</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="connection-dot"></span><span>No account required</span></div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="breadcrumbs"><span>Workspace</span><span class="crumb-divider">/</span><strong>Tasks</strong></div>
        <div class="topbar-status"><span class="api-status" id="api-status"><span class="status-dot"></span><span id="api-status-text">Connecting</span></span></div>
      </header>

      <main class="content">
        <div class="page-heading">
          <div><p class="today-label" id="today-label"></p><h1>My tasks</h1><p class="page-description">Add, organize, and complete your tasks.</p></div>
        </div>

        <section class="progress-card" aria-label="Task completion summary">
          <div class="progress-heading"><span class="progress-title" id="progress-title">Task completion</span><span class="progress-count" id="progress-count">0 / 0</span></div>
          <div class="progress-bottom"><span class="progress-caption" id="progress-caption">No completed tasks</span><div class="progress-track" role="progressbar" aria-label="Task completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-bar"></span></div></div>
        </section>

        <form class="add-form" id="add-form">
          <span class="add-icon" aria-hidden="true">＋</span>
          <input id="new-task" name="title" maxlength="100" placeholder="Add a task…" autocomplete="off" required aria-label="New task title">
          <span class="form-hint">Press Enter to add</span>
          <button class="primary" type="submit">Add task</button>
        </form>

        <section class="task-section" aria-labelledby="list-heading">
          <div class="list-toolbar">
            <div><h2 id="list-heading">All tasks</h2><p id="task-summary">Loading tasks…</p></div>
            <label class="search-wrap" for="task-search"><span aria-hidden="true">⌕</span><input id="task-search" type="search" placeholder="Search tasks" autocomplete="off"><kbd>/</kbd></label>
          </div>
          <ul class="task-list" id="task-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-message"></span><button id="toast-action" type="button" hidden></button></div>

  <script>
    const list = document.querySelector("#task-list");
    const form = document.querySelector("#add-form");
    const input = document.querySelector("#new-task");
    const searchInput = document.querySelector("#task-search");
    const toast = document.querySelector("#toast");
    const toastMessage = document.querySelector("#toast-message");
    const toastAction = document.querySelector("#toast-action");
    const filterButtons = [...document.querySelectorAll(".filter")];
    let tasks = [];
    let activeFilter = "all";
    let toastTimer;

    const icons = {
      edit: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 5 5 5M4 20l4.2-.9L19 8.3a2.1 2.1 0 0 0-3-3L5.2 16.1 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      delete: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19.5 6.8" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      empty: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 3v4m8-4v4M4 9h16m-11 5h6m-6 3h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
    };

    async function request(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { "Content-Type": "application/json", ...options.headers } });
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.detail || `Request failed (${response.status})`);
      }
      return response.status === 204 ? null : response.json();
    }

    function notify(message, action = null) {
      toastMessage.textContent = message;
      toastAction.hidden = !action;
      toastAction.textContent = action?.label || "";
      toastAction.onclick = action ? async () => { toast.classList.remove("show"); await action.run(); } : null;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 5000);
    }

    function setConnection(connected) {
      const indicator = document.querySelector("#api-status");
      indicator.classList.toggle("error", !connected);
      document.querySelector("#api-status-text").textContent = connected ? "Connected" : "Connection issue";
    }

    function render() {
      const completed = tasks.filter(task => task.done).length;
      const active = tasks.length - completed;
      const progress = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
      document.querySelector("#count-all").textContent = tasks.length;
      document.querySelector("#count-active").textContent = active;
      document.querySelector("#count-done").textContent = completed;
      document.querySelector("#progress-count").textContent = `${completed} / ${tasks.length}`;
      document.querySelector("#progress-caption").textContent = tasks.length ? `${completed} completed · ${active} remaining` : "No completed tasks";
      document.querySelector("#progress-bar").style.width = `${progress}%`;
      document.querySelector(".progress-track").setAttribute("aria-valuenow", progress);
      document.querySelector("#today-label").textContent = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }).format(new Date());
      const filterNames = { all: "All tasks", active: "To do", done: "Completed" };
      document.querySelector("#list-heading").textContent = filterNames[activeFilter];
      filterButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter)));

      const query = searchInput.value.trim().toLocaleLowerCase();
      const visible = tasks.filter(task => (activeFilter === "all" || (activeFilter === "done" ? task.done : !task.done)) && task.title.toLocaleLowerCase().includes(query));
      document.querySelector("#task-summary").textContent = query ? `${visible.length} matching ${visible.length === 1 ? "task" : "tasks"}` : `${visible.length} ${visible.length === 1 ? "task" : "tasks"}`;
      list.replaceChildren();

      if (visible.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        const icon = document.createElement("div");
        icon.className = "empty-icon";
        icon.innerHTML = icons.empty;
        const message = document.createElement("div");
        const heading = document.createElement("strong");
        const detail = document.createElement("span");
        if (query) {
          heading.textContent = "No matching tasks";
          detail.textContent = "Try a different search term.";
        } else if (activeFilter === "done") {
          heading.textContent = "No completed tasks";
          detail.textContent = "Completed tasks will appear here.";
        } else if (activeFilter === "active" && tasks.length) {
          heading.textContent = "All tasks are complete";
          detail.textContent = "Switch to Completed to see them.";
        } else {
          heading.textContent = "No tasks yet";
          detail.textContent = "Add your first task using the field above.";
        }
        message.append(heading, detail);
        empty.append(icon, message);
        list.append(empty);
        return;
      }
      visible.forEach(task => list.append(createTaskRow(task)));
    }

    function createTaskRow(task) {
      const row = document.createElement("li");
      row.className = `task-row${task.done ? " done" : ""}`;
      const check = document.createElement("label");
      check.className = "check-wrap";
      check.setAttribute("aria-label", task.done ? `Mark ${task.title} as to do` : `Mark ${task.title} as completed`);
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.addEventListener("change", () => updateTask(task.id, { title: task.title, done: checkbox.checked }));
      const mark = document.createElement("span");
      mark.className = "checkmark";
      mark.innerHTML = icons.check;
      check.append(checkbox, mark);

      const title = document.createElement("span");
      title.className = "task-text";
      title.textContent = task.title;
      const actions = document.createElement("div");
      actions.className = "task-actions";
      const edit = document.createElement("button");
      edit.className = "icon-button";
      edit.type = "button";
      edit.setAttribute("aria-label", `Edit ${task.title}`);
      edit.title = "Edit task";
      edit.innerHTML = icons.edit;
      edit.addEventListener("click", () => startEditing(row, task));
      const remove = document.createElement("button");
      remove.className = "icon-button delete";
      remove.type = "button";
      remove.setAttribute("aria-label", `Delete ${task.title}`);
      remove.title = "Delete task";
      remove.innerHTML = icons.delete;
      remove.addEventListener("click", () => deleteTask(task.id));
      actions.append(edit, remove);
      row.append(check, title, actions);
      return row;
    }

    function startEditing(row, task) {
      const editForm = document.createElement("form");
      editForm.className = "edit-form";
      const editInput = document.createElement("input");
      editInput.className = "edit-input";
      editInput.value = task.title;
      editInput.maxLength = 100;
      editInput.required = true;
      editInput.setAttribute("aria-label", "Edit task title");
      const save = document.createElement("button");
      save.className = "save-edit";
      save.textContent = "Save";
      const cancel = document.createElement("button");
      cancel.className = "cancel-edit";
      cancel.type = "button";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", render);
      editForm.append(editInput, save, cancel);
      row.replaceChildren(editForm);
      editInput.focus();
      editInput.select();
      editForm.addEventListener("submit", async event => {
        event.preventDefault();
        const title = editInput.value.trim();
        if (title) await updateTask(task.id, { title, done: task.done });
      });
      editInput.addEventListener("keydown", event => { if (event.key === "Escape") render(); });
    }

    async function updateTask(id, values) {
      try {
        const updated = await request(`/tasks/${id}`, { method: "PUT", body: JSON.stringify(values) });
        tasks = tasks.map(task => task.id === id ? updated : task);
        setConnection(true);
        render();
      } catch (error) {
        setConnection(false);
        notify(error.message);
        await loadTasks(false);
      }
    }

    async function deleteTask(id) {
      try {
        const removed = tasks.find(task => task.id === id);
        await request(`/tasks/${id}`, { method: "DELETE" });
        tasks = tasks.filter(task => task.id !== id);
        setConnection(true);
        render();
        notify("Task deleted", { label: "Undo", run: async () => {
          try {
            const restored = await request("/tasks", { method: "POST", body: JSON.stringify({ title: removed.title, done: removed.done }) });
            tasks.push(restored);
            setConnection(true);
            render();
            notify("Task restored");
          } catch (error) { notify(error.message); }
        }});
      } catch (error) {
        setConnection(false);
        notify(error.message);
      }
    }

    async function loadTasks(showError = true) {
      try {
        tasks = await request("/tasks");
        setConnection(true);
        render();
      } catch (error) {
        setConnection(false);
        document.querySelector("#task-summary").textContent = "Could not load tasks";
        if (showError) notify("Could not connect to the task service. Refresh to try again.");
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const created = await request("/tasks", { method: "POST", body: JSON.stringify({ title }) });
        tasks.push(created);
        input.value = "";
        activeFilter = "all";
        setConnection(true);
        render();
        input.focus();
      } catch (error) {
        setConnection(false);
        notify(error.message);
      } finally { button.disabled = false; }
    });

    filterButtons.forEach(button => button.addEventListener("click", () => { activeFilter = button.dataset.filter; render(); }));
    searchInput.addEventListener("input", render);
    document.addEventListener("keydown", event => {
      if (event.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) { event.preventDefault(); searchInput.focus(); }
      if (event.key.toLowerCase() === "n" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) { event.preventDefault(); input.focus(); }
      if (event.key === "Escape" && document.activeElement === searchInput) { searchInput.value = ""; searchInput.blur(); render(); }
    });
    loadTasks();
  </script>
</body>
</html>
